<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>GitHub Copilot in VS Code – Tips und Tricks</title>

    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link
      rel="stylesheet"
      href="node_modules/reveal.js/dist/theme/black.css"
      id="theme"
    />

    <!-- Theme für Syntax-Highlighting in Code-Blöcken -->
    <link
      rel="stylesheet"
      href="node_modules/reveal.js/dist/plugin/highlight/monokai.css"
    />

    <!-- Eigene Anpassungen: immer NACH dem Theme laden -->
    <link rel="stylesheet" href="css/custom.css" />
  </head>

  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Jeder Abschnitt des Vortrags = eine Markdown-Datei in slides/.
          Neue Abschnitte hier in der gewünschten Reihenfolge eintragen.

          Trenner innerhalb einer Datei:
            ---   neue horizontale Folie (Kernprogramm)
            --    neue vertikale Folie   (optionale Vertiefung)
            Note: alles danach wird zur Speaker Note
        -->
        <section
          data-markdown="slides/00-titel.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/01-einstieg.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/02-was-aendert-sich.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/03-arbeitsablauf.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/04-repo-setup.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/05-ide-vergleich.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/06-firmenregeln.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <section
          data-markdown="slides/07-qa.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>

        <!--
          Vorlage/Spielwiese: zeigt alle Bausteine, gehört nicht zum Vortrag.
          Vor dem Vortragstag diesen letzten Abschnitt auskommentieren.
        -->
        <section
          data-markdown="slides/90-vorlage.md"
          data-separator="^\r?\n---\r?\n"
          data-separator-vertical="^\r?\n--\r?\n"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>
      </div>
    </div>

    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/dist/plugin/markdown.js"></script>
    <script src="node_modules/reveal.js/dist/plugin/highlight.js"></script>
    <script src="node_modules/reveal.js/dist/plugin/notes.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
